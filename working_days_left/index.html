                           <title>Working Days Left - Anders Oelmann</title><style>*{margin:0;padding
                                  :0;box-sizing:border-box;}body{min-height:100vh;
                                 display:flex;justify-content:center;align-items:center
                               ;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%)
                              ;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto
                            ,sans-serif;color:#fff;}.container{text-align:center;padding:2rem;}
                           .count{font-size:clamp(6rem,20vw,12rem);font-weight:700;line-height:1;
                         background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);-webkit-background
                        -clip:text;-webkit-text-fill-color:transparent;background-clip:text;}.label{font
                      -size:clamp(1.2rem,4vw,2rem);color:#a0a0a0;margin-top:0.5rem;}.details{margin-top:2rem
                                           ;font-size:0.9rem;color:#606060;}
                                          footer{position:fixed;bottom:0;left:0
                                         ;right:0;padding:1rem 2rem;display:flex;
                                        justify-content:space-between;align-items:
                                       center;font-size:0.85rem;background:rgba(255,
                                      255,255,0.95);}footer a{display:flex;align-items:
                                    center;gap:0.4rem;color:#555;text-decoration:none;}footer
                                   a:hover{color:#333;}footer img{height:1.2rem;}footer a:last-child
                                  img{height:1.8rem;}</style></head><body><div class="container"><div
                                 class="count" id="count">-</div><div class="label">working days left</div>
                                <div class="details">Final shift: Thursday, May 28, 2026</div></div><script>const
                               LAST_DAY=new Date(2026,4,28);const DANISH_HOLIDAYS=[[2026,0,1],[2026,3,2],[2026,3,6
                              ],[2026,4,14],[2026,4,25]];const DAYS_OFF=[[2026,3,30],[2026,4,18],[2026,4,19]];function
                            isHoliday(date){const year=date.getFullYear(),month=date.getMonth(),day=date.getDate();for(
                           const[y,m,d]of[...DANISH_HOLIDAYS,...DAYS_OFF]){if(year===y&&month===m&&day===d)return true;}
                          return false;}function isWorkingDay(date){const dayOfWeek=date.getDay();if(dayOfWeek<1||dayOfWeek
                        >4)return false;if(isHoliday(date))return false;return true;}function countWorkingDays(){const now=new Date();const today=
                                          new Date(now);today.setHours(0,0,0,0);if(now.getHours()>=15){today.setDate(today.getDate()+1);}const lastDay
                                          =new Date(LAST_DAY);lastDay.setHours(0,0,0,0);if(
                                          today>lastDay)return 0;let count=0;const current=
                                          new Date(today);while(current<=lastDay){if(isWorkingDay
                                          (current)){count++;}current.setDate(current.getDate()+1)
                                          ;}return count;}const count=countWorkingDays();const countEl
                                          =document.getElementById('count');const labelEl=document.querySelector
                                          ('.label');if(count===0){countEl.textContent='Done!';labelEl.textContent=''
                                          ;}else{countEl.textContent=count;}</script><footer><a
                                          href="https://www.statichost.eu/" target="_blank" rel="noopener">Hosted on
                                          <img src="https://www.statichost.eu/logo.svg" alt="statichost.eu"></a><a
                                          href="https://european-alternatives.eu/" target="_blank" rel="noopener"><img
                                          src="https://european-alternatives.eu/images/european-alternatives-logo.svg"
                                          alt="European Alternatives"></a></footer></body></html>
